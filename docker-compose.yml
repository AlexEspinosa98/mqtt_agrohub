services:
  db:
    image: postgres:16
    container_name: agrohub_mqtt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrohub_mqtt}
      POSTGRES_USER: ${POSTGRES_USER:-agrohub_mqtt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - agrohub_mqtt_pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrohub_mqtt}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  agrohub_mqtt_pg_data:
    name: agrohub_mqtt_pg_data
