# Mosquitto — broker para los gateways AgroHub (y, a futuro, otros sistemas IoT) del proyecto
# IoT Unimagdalena. Ver README.md de este repo para el plan completo de despliegue.
#
# Copiar a /etc/mosquitto/mosquitto.conf en el servidor.
#
# NO usa un subdominio propio: MQTT es un protocolo TCP crudo (no HTTP), no tiene "rutas" como
# /mqtt, así que no se puede enrutar por path detrás de nginx. En vez de pedir un subdominio
# nuevo, reutiliza el dominio y el certificado que YA existen (back.alunaia.co) — Mosquitto
# escucha directo en el puerto 8883, sin pasar por nginx (que sigue solo con 80/443). Los
# gateways se conectan a back.alunaia.co:8883.
#
# Let's Encrypt guarda el cert en /etc/letsencrypt/live/back.alunaia.co/, legible normalmente
# solo por root — Mosquitto corre con su propio usuario del sistema y no puede leerlo ahí
# directo. Ver mosquitto/certbot-deploy-hook.sh: copia el cert a /etc/mosquitto/certs/ (legible
# por el usuario mosquitto) y recarga Mosquitto, automáticamente en cada renovación de certbot.

per_listener_settings true

# --- Listener público: gateways y sistemas IoT, por internet ---
# Nunca exponer 1883 sin cifrar a internet — ver README, nota de seguridad.
listener 8883
protocol mqtt
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.conf

# --- Listener interno: solo el servicio persister (mqtt_agrohub), en el mismo servidor ---
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.conf

# Sesiones persistentes (clean session desactivada del lado del gateway, ver manual sección 03)
# — los comandos QoS 1 quedan retenidos mientras un gateway está desconectado.
persistence true
persistence_location /var/lib/mosquitto/

log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice

# Evita que un cliente con bug llene la cola de mensajes sin límite mientras está desconectado.
max_queued_messages 1000
max_inflight_messages 20

# Límite de conexiones simultáneas — ajustar según la cantidad real de gateways/sistemas
# esperados; puesto en un número concreto (no -1/ilimitado) porque el broker recibe conexiones
# de internet público.
max_connections 200
